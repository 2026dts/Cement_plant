<!DOCTYPE html>
<!--
  Control page - Architecture v5, Feature C ("Split ON/OFF Actuator Links")

  Usage:
    control.html?id=motor_feed&action=on   -> paste into the GREEN power icon's hotspot
    control.html?id=motor_feed&action=off  -> paste into the RED power icon's hotspot

  Cupola just opens a URL when a hotspot is clicked - there's no button to tap
  inside the embed - so this page fires the action itself on load and shows a
  short confirmation line.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Control</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    }
    #status {
      display: inline-block;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <span id="status">sending...</span>

  <script>
    // Point this at your backend (Architecture v5, Section 5).
    const API_BASE = "http://localhost:4000";

    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");
    const action = params.get("action"); // "on" or "off"
    const statusEl = document.getElementById("status");

    if (!itemId || (action !== "on" && action !== "off")) {
      statusEl.textContent = "missing ?id= or ?action=on|off";
    } else {
      fetch(`${API_BASE}/api/item/${itemId}/action/${action}`)
        .then((r) => r.text())
        .then((text) => {
          statusEl.textContent = text; // e.g. "MOTOR_FEED: ON"
        })
        .catch(() => {
          statusEl.textContent = "command failed";
        });
    }
  </script>
</body>
</html>
