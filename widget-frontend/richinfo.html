<!DOCTYPE html>
<!--
  Rich Info Widget - Cupola360 Rich Info Text / Card Overlay
  Usage: richinfo.html?id=gypsum or richinfo.html?id=klin_dht_temp
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rich Info Widget</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .card {
      background: rgba(18, 24, 38, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 18px;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      min-width: 200px;
      max-width: 280px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .badge.offline {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .value-container {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 8px 0;
    }
    .value {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }
    .unit {
      font-size: 15px;
      font-weight: 500;
      color: #cbd5e1;
    }
    .alarm {
      font-size: 12px;
      font-weight: 700;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }
    .alarm.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="header">
      <span class="title" id="title">--</span>
      <span class="badge" id="badge">LIVE</span>
    </div>
    <div class="value-container">
      <span class="value" id="val">--</span>
      <span class="unit" id="unit"></span>
    </div>
    <div class="alarm" id="alarm"></div>
  </div>

  <script src="js/ws-client.js"></script>
  <script>
    const backendProtocol = window.location.protocol === "https:" ? "https:" : "http:";
    const websocketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const API_BASE = `${backendProtocol}//${window.location.hostname}:4000`;
    const WS_URL   = `${websocketProtocol}//${window.location.hostname}:4000/ws`;

    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");

    const titleEl = document.getElementById("title");
    const valEl = document.getElementById("val");
    const unitEl = document.getElementById("unit");
    const alarmEl = document.getElementById("alarm");
    const badgeEl = document.getElementById("badge");

    function formatTitle(id) {
      if (!id) return "--";
      return id.replace(/_/g, " ");
    }

    function render(itemId, value, unit) {
      titleEl.textContent = formatTitle(itemId);
      
      let shown = value === null || value === undefined ? "--" : value;
      if (typeof shown === "number" && shown < 0) {
        shown = 0;
      }
      valEl.textContent = shown;
      unitEl.textContent = unit || "";

      const numVal = Number(value);
      const HOPPER_MATERIALS = ["gypsum", "clay", "iron_ore", "sand", "limestone", "lime_stone"];
      const isHopper = HOPPER_MATERIALS.includes(itemId);

      if (isHopper && value !== null && value !== undefined && value !== "" && Number.isFinite(numVal)) {
        if (numVal > 20) {
          alarmEl.textContent = "⚠️ OVERLOAD ALARM";
          alarmEl.classList.add("visible");
        } else if (numVal < 5) {
          alarmEl.textContent = "⚠️ UNDER WEIGHT ALARM";
          alarmEl.classList.add("visible");
        } else {
          alarmEl.classList.remove("visible");
        }
      } else {
        alarmEl.classList.remove("visible");
      }
    }

    if (!itemId) {
      titleEl.textContent = "Missing ?id=";
      badgeEl.textContent = "ERROR";
      badgeEl.classList.add("offline");
    } else {
      titleEl.textContent = formatTitle(itemId);

      // Initial snapshot fetch
      fetch(`${API_BASE}/api/item/${itemId}`)
        .then((r) => r.json())
        .then((data) => render(itemId, data.value, data.unit))
        .catch(() => {
          badgeEl.textContent = "OFFLINE";
          badgeEl.classList.add("offline");
        });

      // Live updates
      connectWidgetSocket(WS_URL, itemId, (data) => {
        badgeEl.textContent = "LIVE";
        badgeEl.classList.remove("offline");
        render(itemId, data.value, data.unit);
      });
    }
  </script>
</body>
</html>
