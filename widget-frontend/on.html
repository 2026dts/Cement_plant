<!DOCTYPE html>
<!--
  Dedicated ON Actuator Widget for Cupola Integration
  Usage: on.html?id=crusher
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ON Control Widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .widget-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px;
    }
    .power-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      background: #22c55e;
      opacity: 0.45;
      transition: opacity 0.15s, transform 0.1s;
    }
    .power-btn:active {
      transform: scale(0.92);
    }
    .power-btn.active {
      opacity: 1;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
    }
    .power-btn svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      stroke-width: 2.4;
      fill: none;
    }
    #label {
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      text-align: center;
      margin-top: 4px;
    }
    #status {
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="js/ws-client.js"></script>
  <script>
    const backendProtocol = window.location.protocol === "https:" ? "https:" : "http:";
    const websocketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const API_BASE = `${backendProtocol}//${window.location.hostname}:4000`;
    const WS_URL   = `${websocketProtocol}//${window.location.hostname}:4000/ws`;

    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");
    const root = document.getElementById("root");

    const powerIcon = `<svg viewBox="0 0 24 24"><path d="M12 2v8" stroke-linecap="round"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0" stroke-linecap="round"/></svg>`;

    if (!itemId) {
      root.innerHTML = `<span id="status">missing ?id=</span>`;
    } else {
      root.innerHTML = `
        <div class="widget-container">
          <button class="power-btn" id="btnOn" aria-label="Turn ON">${powerIcon}</button>
          <span id="label">${itemId}: ON</span>
        </div>
      `;

      const btnOn = document.getElementById("btnOn");

      function setActive(state) {
        btnOn.classList.toggle("active", state === "on");
      }

      function sendOn() {
        setActive("on");
        fetch(`${API_BASE}/api/item/${itemId}/on`).catch(() => {});
      }

      btnOn.addEventListener("click", sendOn);

      // Initial state snapshot
      fetch(`${API_BASE}/api/item/${itemId}`)
        .then((r) => r.json())
        .then((data) => setActive(data.value))
        .catch(() => {});

      // Live updates via WebSocket
      connectWidgetSocket(WS_URL, itemId, (data) => {
        setActive(data.value);
      });
    }
  </script>
</body>
</html>
