<!DOCTYPE html>
<!--
  Dedicated OPEN Gate Widget for Cupola Integration
  Usage: open.html?id=raw_material_gate
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OPEN Gate Control Widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .widget-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px;
    }
    .power-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      background: #3b82f6;
      opacity: 0.45;
      transition: opacity 0.15s, transform 0.1s;
    }
    .power-btn:active {
      transform: scale(0.92);
    }
    .power-btn.active {
      opacity: 1;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
    }
    .power-btn svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      stroke-width: 2.4;
      fill: none;
    }
    #label {
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      text-align: center;
      margin-top: 4px;
    }
    #status {
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="js/ws-client.js"></script>
  <script>
    const API_BASE = "http://localhost:4000";
    const WS_URL   = "ws://localhost:4000/ws";

    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id") || "raw_material_gate";
    const root = document.getElementById("root");

    const openIcon = `<svg viewBox="0 0 24 24"><path d="M7 11V7a5 5 0 0 1 9.9-1" stroke-linecap="round"/><rect x="5" y="11" width="14" height="10" rx="2" stroke-linecap="round"/></svg>`;

    root.innerHTML = `
      <div class="widget-container">
        <button class="power-btn" id="btnOpen" aria-label="OPEN Gate">${openIcon}</button>
        <span id="label">${itemId}: OPEN</span>
      </div>
    `;

    const btnOpen = document.getElementById("btnOpen");

    function setActive(state) {
      btnOpen.classList.toggle("active", state === "open");
    }

    function sendOpen() {
      setActive("open");
      fetch(`${API_BASE}/api/item/${itemId}/open`).catch(() => {});
    }

    btnOpen.addEventListener("click", sendOpen);

    // Initial state snapshot
    fetch(`${API_BASE}/api/item/${itemId}`)
      .then((r) => r.json())
      .then((data) => setActive(data.value))
      .catch(() => {});

    // Live updates via WebSocket
    connectWidgetSocket(WS_URL, itemId, (data) => {
      setActive(data.value);
    });
  </script>
</body>
</html>
