<!DOCTYPE html>
<!--
  Widget page - Architecture v5, Feature A ("Cupola-Native Inline Value Overlay")

  Usage: widget.html?id=iron_ore

  Deliberately minimal: no card, no border, no background box. Just a single
  line of text ("iron_ore: 52 gm") so it visually blends with Cupola's own
  floating icon labels when this page is embedded in a hotspot.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    }
    #label {
      display: inline-block;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      padding: 2px 6px;
    }
    #alarm {
      min-height: 20px;
      color: #ff3b30;
      font-size: 16px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      padding: 0 6px 2px;
    }
  </style>
</head>
<body>
  <div id="label">--</div>
  <div id="alarm" role="status" aria-live="polite"></div>

  <script src="js/ws-client.js"></script>
  <script>
    // Use the host serving this widget, so another device does not resolve
    // localhost to itself instead of the laptop running the backend.
    const backendProtocol = window.location.protocol === "https:" ? "https:" : "http:";
    const websocketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const API_BASE = `${backendProtocol}//${window.location.hostname}:4000`;
    const WS_URL   = `${websocketProtocol}//${window.location.hostname}:4000/ws`;

    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");
    const labelEl = document.getElementById("label");
    const alarmEl = document.getElementById("alarm");

    const HOPPER_MATERIALS = ["gypsum", "clay", "iron_ore", "sand", "limestone", "lime_stone"];

    function render(itemId, value, unit) {
      let shown = value === null || value === undefined ? "--" : value;
      if (typeof shown === "number" && shown < 0) {
        shown = 0;
      }
      labelEl.textContent = `${itemId}: ${shown}${unit ? " " + unit : ""}`;

      const weight = Number(value);
      const isHopper = HOPPER_MATERIALS.includes(itemId);

      if (isHopper && value !== null && value !== undefined && value !== "" && Number.isFinite(weight)) {
        if (weight > 20) {
          alarmEl.textContent = "OVERLOAD ALARM";
          alarmEl.style.color = "#ff3b30";
        } else if (weight < 5) {
          alarmEl.textContent = "UNDER WEIGHT ALARM";
          alarmEl.style.color = "#ff3b30";
        } else {
          alarmEl.textContent = "";
        }
      } else {
        alarmEl.textContent = "";
      }
    }

    if (!itemId) {
      labelEl.textContent = "missing ?id=";
    } else {
      // Initial snapshot so the label isn't blank before the first WS message.
      fetch(`${API_BASE}/api/item/${itemId}`)
        .then((r) => r.json())
        .then((data) => render(itemId, data.value, data.unit))
        .catch(() => {});

      // Live updates, scoped to just this item (Architecture v5, Section 4.2).
      connectWidgetSocket(WS_URL, itemId, (data) => {
        render(itemId, data.value, data.unit);
      });
    }
  </script>
</body>
</html>
